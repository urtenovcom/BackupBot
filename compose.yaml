services:
  backupbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: backupbot:latest
    container_name: backupbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Application configuration (read-only)
      - ./config.yaml:/app/config.yaml:ro

      # SQLite persistent state database
      - ./data/state:/var/lib/backupbot

      # Temporary directory for staging and chunking backups
      - ./data/tmp:/var/tmp/backupbot

      # Docker daemon socket: required for `docker exec` DB dumps and volume inspection
      - /var/run/docker.sock:/var/run/docker.sock

      # Host project paths to backup (read-only)
      - /opt:/opt:ro

      # Host Docker volumes directory (optional direct read-only access)
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro

    # Default command starts the automated scheduler daemon
    command: ["run-scheduler", "--config", "/app/config.yaml"]
